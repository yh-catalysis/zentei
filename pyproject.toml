[project]
name = "zentei"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
zentei = "zentei.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
